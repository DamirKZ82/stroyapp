# =============================================================================
# ToiApp — nginx (контейнер nginx из docker-compose.yml)
#
#  :80  — отдаёт проверки Let's Encrypt, всё остальное отправляет на HTTPS
#  :443 — api.toiapp.kz: фото из тома uploads и всё остальное на бэкенд
#
# Сертификат лежит в ./certbot/conf (в контейнере — /etc/letsencrypt). Без
# него nginx не запустится: при переезде его копируют со старого сервера,
# на чистом сервере — выпускают, см. docs/SERVER-MIGRATION.md.
# =============================================================================

upstream toyhana_backend {
    server backend:1500;
    keepalive 32;
}


server {
    listen 80;
    listen [::]:80;
    server_name api.toiapp.kz;

    # Проверки Let's Encrypt при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.toiapp.kz;

    ssl_certificate     /etc/letsencrypt/live/api.toiapp.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.toiapp.kz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;

    # Фото — прямо из тома, без бэкенда.
    location /uploads/ {
        alias /data/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://toyhana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
